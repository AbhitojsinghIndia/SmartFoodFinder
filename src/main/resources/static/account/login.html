
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartFoodFinder</title>
    <link rel="stylesheet" href="/account/login.css">
    <script src="/account/login.js" defer></script>
</head>
<body>

    <main class="login-container">
        <section class="login-card">

            <a href="/" class="brand">SmartFoodFinder</a>

            <h1>Welcome Back!</h1>
            <p class="subtitle">Log in to manage your kitchen and groceries.</p>

            <div id="form-message" class="form-message" hidden></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" id="login-button">
                    Login
                </button>
            </form>

            <p class="register-link">
                Don't have an account?
                <a href="/account/register.html">Create Account</a>
            </p>

            <a href="/" class="back-link">← Back to Home</a>

        </section>
    </main>

</body>
</html>
